spring:
  application:
    name: ms-auth
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    defer-datasource-initialization: false
  flyway:
    locations: classpath:db/migration
    enabled: true
    baseline-on-migrate: false
    out-of-order: false
    encoding: UTF-8

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

services:
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

password-reset:
  expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: local
  # Sin esto, el @RestControllerAdvice del servicio resuelve la excepcion antes de que
  # el resolver de Sentry tenga oportunidad de capturarla, y nunca se reporta nada.
  exception-resolver-order: -2147483648
