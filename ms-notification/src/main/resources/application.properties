server.port=8085
spring.application.name=ms-notification

# H2 Database
spring.datasource.url=jdbc:h2:mem:notificaciones_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=false

# Flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false

# Email Configuration (para desarrollo - usar fake SMTP o configurar real)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tu_email@gmail.com
spring.mail.password=tu_contraseña
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Direccion "From" mostrada al destinatario. Debe ser un remitente verificado
# en el proveedor SMTP (con Brevo, por ejemplo, no puede ser el login SMTP).
app.mail.from=${MAIL_FROM:tu_email@gmail.com}

sentry.dsn=${SENTRY_DSN:}
sentry.environment=local
sentry.exception-resolver-order=-2147483648

# Logging
logging.level.notificaciones_service=DEBUG

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
# Clave compartida solo con ms-auth para la llamada interna POST /api/notifications/email
# (correo de recuperacion de contrasena, sin usuario logueado del que reenviar un JWT).
internal.api.key=${INTERNAL_API_KEY}